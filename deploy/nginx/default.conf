# Per-IP request rate zones (lightweight anti-abuse, single-machine friendly).
limit_req_zone $binary_remote_addr zone=qa_rate:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=trial_rate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_page_rate:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=admin_api_rate:10m rate=3r/m;

# Per-IP concurrent connection zone.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream next_web {
  server web:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Keep upload unrestricted at nginx layer (application handles its own flow).
  client_max_body_size 0;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  # Return HTTP 429 when request/concurrency limits are exceeded.
  limit_req_status 429;
  limit_conn_status 429;

  # Basic connection cap per IP to reduce abusive bursts.
  limit_conn conn_per_ip 30;

  # Block common scanner paths directly.
  location ~* ^/(wp-admin|wp-login\.php|phpmyadmin|\.env|\.git|vendor|actuator|boaform) {
    return 403;
  }

  # QA APIs (includes /api/qa/ask, /api/qa/history)
  location ^~ /api/qa {
    limit_req zone=qa_rate burst=3 nodelay;

    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }

  # Trial APIs
  location = /api/trial {
    limit_req zone=trial_rate burst=5 nodelay;

    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }

  # Backward-compatible lead endpoint
  location = /api/leads {
    limit_req zone=trial_rate burst=5 nodelay;

    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }

  # Admin page and all admin APIs
  location ^~ /admin {
    limit_req zone=admin_page_rate burst=6 nodelay;

    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }

  location ^~ /api/admin {
    limit_req zone=admin_api_rate burst=2 nodelay;

    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }

  # Default reverse proxy for all other routes.
  location / {
    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }
}
